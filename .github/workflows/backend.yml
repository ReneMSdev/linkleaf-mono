name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qr_app_user
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: linkleaf_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    # No repository secrets needed: tests fake the logged-in user and mock storage.
    # Firebase still parses a service-account key at import, so a throwaway one is
    # generated below. Placeholders here only satisfy required settings.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_NAME: LinkLeaf
      APP_ENV: test
      DEBUG: 'false'
      SECRET_KEY: ci-placeholder
      PUBLIC_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+asyncpg://qr_app_user:devpassword@localhost/linkleaf_test
      TEST_DATABASE_URL: postgresql+asyncpg://qr_app_user:devpassword@localhost/linkleaf_test
      FIREBASE_PROJECT_ID: linkleaf-ci-fake
      GCS_PUBLIC_BUCKET_NAME: ci-public
      GCS_PRIVATE_BUCKET_NAME: ci-private
      GCS_PROJECT_ID: linkleaf-ci-fake
      REVENUECAT_WEBHOOK_SECRET: ci-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt', 'backend/requirements-prod.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate throwaway service-account credential
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ).decode()
          cred = json.dumps({
              "type": "service_account",
              "project_id": "linkleaf-ci-fake",
              "private_key_id": "fake",
              "private_key": pem,
              "client_email": "ci@linkleaf-ci-fake.iam.gserviceaccount.com",
              "client_id": "0",
              "token_uri": "https://oauth2.googleapis.com/token",
          })
          for name in ("FIREBASE_SERVICE_ACCOUNT_JSON", "GCS_SERVICE_ACCOUNT_JSON"):
              print(f"{name}={cred}")
          PY

      - name: Run migrations
        run: alembic upgrade head

      - name: Run test suite
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Coverage check
        run: pytest tests/ --cov=app --cov-fail-under=50
